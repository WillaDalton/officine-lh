<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilités des employés – Officine LH</title><link rel="stylesheet" href="css/style.css"></head><body><main id="main">
<div class="card"><h3>Saisir une disponibilité</h3><p>Indiquez le jour et les heures approximatives de présence.</p><form class="f" id="form"><label>Employé<select name="s" id="st"></select></label><label>Jour<input type="date" name="d" required value="2026-10-05"></label><label>De<input type="time" name="a" required value="09:00"></label><label>À<input type="time" name="b" required value="17:00"></label><button>Ajouter</button></form></div><div class="card"><h3>Planning</h3><div id="list"></div></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>layout("Disponibilités des employés");
document.getElementById("st").innerHTML=DATA.staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
function render(){const v=DATA.availability.slice().sort((x,y)=>x.date.localeCompare(y.date)||x.from.localeCompare(y.from));
document.getElementById("list").innerHTML=table(["Jour","Employé","Grade","Heures","",],v.map(a=>[dow(a.date)+" "+fdate(a.date),esc(staffName(a.staff)),esc((byId(DATA.staff,a.staff)||{}).grade||""),"~ "+a.from+" – "+a.to,`<button class="sec" data-i="${DATA.availability.indexOf(a)}">Suppr.</button>`]))}
document.getElementById("list").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){DATA.availability.splice(+i,1);render()}};
document.getElementById("form").onsubmit=e=>{e.preventDefault();const f=e.target;if(f.b.value<=f.a.value){alert("L'heure de fin doit être après le début");return}DATA.availability.push({staff:f.s.value,date:f.d.value,from:f.a.value,to:f.b.value});render()};render();</script></body></html>
