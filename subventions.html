<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi des subventions – Officine LH</title><link rel="stylesheet" href="css/style.css"></head><body><main id="main">
<div id="kpi" class="grid"></div><div class="card" style="margin-top:16px"><h3>Subventions</h3><div id="list"></div></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>layout("Suivi des subventions");
const g=DATA.grants;
document.getElementById("kpi").innerHTML=`<div class="card"><h3>Total accordé / demandé</h3><div class="big">${eur(sum(g.map(x=>x.amount)))}</div></div><div class="card"><h3>Déjà perçu</h3><div class="big pos">${eur(sum(g.map(x=>x.received)))}</div></div><div class="card"><h3>Reste à percevoir</h3><div class="big">${eur(sum(g.map(x=>x.amount-x.received)))}</div></div>`;
document.getElementById("list").innerHTML=table(["Subvention","Organisme","Montant","Perçu","Avancement","Statut","Échéance","Note"],g.map(x=>[esc(x.name),x.body,eur(x.amount),eur(x.received),`<div class="bar"><i style="width:${x.received/x.amount*100}%"></i></div>`,tag(x.status),fdate(x.deadline),esc(x.note)]),[2,3]);</script></body></html>
