<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramétrage – Officine LH</title><link rel="stylesheet" href="css/style.css"></head><body><main id="main">

<div class="tabs" id="tabs"><button data-t="t1" class="on">Entreprises</button><button data-t="t2">Produits vendus</button><button data-t="t3">Matières premières</button><button data-t="t4">Recettes</button></div>
<div class="card tab" id="t1"><h3>Entreprises (clients / fournisseurs)</h3><form class="f" id="fc"><label>Nom<input name="n" required></label><label>Type<select name="t"><option>Client</option><option>Fournisseur</option><option>Client / Fournisseur</option></select></label><label>Contact<input name="c"></label><button>Ajouter</button></form><div id="lc"></div></div>
<div class="card tab" id="t2" hidden><h3>Produits vendus</h3><form class="f" id="fp"><label>Nom<input name="n" required></label><label>Prix de vente (€)<input type="number" step="0.01" min="0" name="p" required></label><label>Stock minimum<input type="number" min="0" name="m" required></label><button>Ajouter</button></form><div id="lp"></div></div>
<div class="card tab" id="t3" hidden><h3>Matières premières</h3><form class="f" id="fm"><label>Nom<input name="n" required></label><label>Unité<input name="u" required style="width:70px" placeholder="kg"></label><label>Prix unitaire (€)<input type="number" step="0.01" min="0" name="p" required></label><label>Stock minimum<input type="number" min="0" name="m" required></label><button>Ajouter</button></form><div id="lm"></div></div>
<div class="card tab" id="t4" hidden><h3>Recettes de fabrication</h3><p>Quantité de matière nécessaire pour fabriquer 1 unité de produit.</p><form class="f" id="fr"><label>Produit<select name="p" id="rp"></select></label><label>Matière<select name="m" id="rm"></select></label><label>Quantité<input type="number" step="0.001" min="0.001" name="q" required style="width:90px"></label><button>Ajouter / modifier l'ingrédient</button></form><div id="lr"></div></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>layout("Paramétrage");
const zero=()=>Object.fromEntries(DATA.storages.map(s=>[s,0]));
document.getElementById("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));document.querySelectorAll(".tab").forEach(c=>c.hidden=c.id!==t);location.hash=t};
const $=i=>document.getElementById(i);
function render(){
$("lc").innerHTML=table(["Nom","Type","Contact"],DATA.companies.map(c=>[esc(c.name),esc(c.type),esc(c.contact)]));
$("lp").innerHTML=table(["Nom","Prix","Stock minimum"],DATA.products.map(p=>[esc(p.name),eur(p.price),p.min]),[1,2]);
$("lm").innerHTML=table(["Nom","Unité","Prix unitaire","Stock minimum"],DATA.materials.map(m=>[esc(m.name),esc(m.unit),eur(m.price),m.min]),[2,3]);
$("lr").innerHTML=table(["Produit","Recette (pour 1 unité)","Coût matière"],DATA.products.map(p=>[esc(p.name),Object.entries(p.recipe).map(([i,q])=>{const m=byId(DATA.materials,i);return q+" "+esc(m.unit)+" "+esc(m.name)}).join("<br>")||"<i>aucune</i>",eur(Object.entries(p.recipe).reduce((a,[i,q])=>a+q*byId(DATA.materials,i).price,0))]),[2]);
$("rp").innerHTML=DATA.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
$("rm").innerHTML=DATA.materials.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.unit)})</option>`).join("");}
$("fc").onsubmit=e=>{e.preventDefault();const f=e.target;DATA.companies.push({id:"K"+(DATA.companies.length+1),name:f.n.value,type:f.t.value,contact:f.c.value});f.reset();render()};
$("fp").onsubmit=e=>{e.preventDefault();const f=e.target;DATA.products.push({id:"P"+(DATA.products.length+1),name:f.n.value,price:+f.p.value,min:+f.m.value,recipe:{},stock:zero()});f.reset();render()};
$("fm").onsubmit=e=>{e.preventDefault();const f=e.target;DATA.materials.push({id:"M"+(DATA.materials.length+1),name:f.n.value,unit:f.u.value,price:+f.p.value,min:+f.m.value,ordered:0,stock:zero()});f.reset();render()};
$("fr").onsubmit=e=>{e.preventDefault();const f=e.target;byId(DATA.products,f.p.value).recipe[f.m.value]=+f.q.value;render()};
render();
const h=location.hash.slice(1);if(/^t[1-4]$/.test(h))document.querySelector(`#tabs [data-t=${h}]`).click();</script></body></html>
