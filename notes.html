<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes internes – Officine LH</title><link rel="stylesheet" href="css/style.css"></head><body><main id="main">
<div class="card"><h3>Nouvelle note</h3><form class="f" id="form"><label>Auteur<input name="a" required></label><label>Note<textarea name="t" rows="2" cols="50" required></textarea></label><button>Publier</button></form></div><div id="list"></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>layout("Notes internes");
function render(){document.getElementById("list").innerHTML=DATA.notes.map(n=>`<div class="note"><small>${fdate(n.date)} – ${esc(n.author)}</small><br>${esc(n.text)}</div>`).join("")}
document.getElementById("form").onsubmit=e=>{e.preventDefault();const f=e.target;DATA.notes.unshift({date:"2026-10-05",author:f.a.value,text:f.t.value});f.reset();render()};render();</script></body></html>
